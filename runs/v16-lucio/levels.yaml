defaults:
  angular_speed_range: [0.0, 0.0]
  spawn_xy_radius: 0.8
  spawn_z_range: [0.5, 1.5]
  vary_speed: false
  turt_noise: false

# Niveles viejos de curriculum learning (ya no se usan, el entorno es siempre turtlebot_hard_fixed):
  # linear_speed_range: [0.13, 0.13]
  # linear_speed_range: [0.19, 0.19]
  # linear_speed_range: [0.05, 0.25]  # vary_speed: true
  # linear_speed_range: [0.1, 0.3]    # vary_speed: true                          -> linear_hard_vary
  # linear_speed_range: [0.1, 0.3]    angular_speed_range: [0.1, 0.8]  turt_noise -> turtlebot_easy_fixed
  # linear_speed_range: [0.1, 0.3]    angular_speed_range: [0.1, 2.84] turt_noise -> turtlebot_medium_fixed

turtlebot_hard_fixed:
  linear_speed_range: [0.05, 0.3] # Max real: 0.22
  angular_speed_range: [0.0, 3.0] # Max real: 2.84
  vary_speed: true
  turt_noise: true