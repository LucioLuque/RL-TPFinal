# params: linear_max_speed, angular_max_speed, spawn_radius
# turtlebot is capped at 0.22 m/s linear speed and 2.84 rad/s angular speed. Hardest level should be a little bit 
# this is a yaml file that contains the parameters for each level. The parameters are used to create the environment and to train the agent. The parameters are also used to evaluate the agent. The parameters are:

# linear_speed_range: the range of linear speeds that the platform can have. m/s
# angular_speed_range: the range of angular speeds that the platform can have. rad/s

# Si estos son fijos dejamos un default y listo
# spawn_xy_radius: the radius of the circle in the xy plane where the drone can spawn. m
# spawn_z_range: the range of z coordinates where the drone can spawn. m

# Flags:
# vary_speed: whether to vary platform speed during episodes

# defaults are angular (0,0), spawn_xy (-1,1), spawn_z (0.5,1.5), vary_speed false

defaults:
  angular_speed_range: [0.0, 0.0]
  spawn_xy_radius: 0.8
  spawn_z_range: [0.5, 1.5]
  vary_speed: false
  turt_noise: false

levels:
  - id: 0
     #name: "linear_easy_fixed"
    linear_speed_range: [0.15, 0.15]

  - id: 1
    # name: "linear_medium_fixed"
    linear_speed_range: [0.22, 0.22]

  - id: 2
    # name: "linear_hard_fixed"
    linear_speed_range: [0.1, 0.3]

  - id: 3
    # name: "linear_hard_vary"
    linear_speed_range: [0.1, 0.3]
    vary_speed: true

  - id: 4
    # name: "turtlebot_easy_fixed"
    linear_speed_range: [0.1, 0.3]
    angular_speed_range: [0.1, 0.8]
    turt_noise: true

  - id: 5
    # name: "turtlebot_medium_fixed"
    linear_speed_range: [0.1, 0.3]
    angular_speed_range: [0.1, 2.84]
    turt_noise: true

  - id: 6
    # name: "turtlebot_hard_fixed"
    linear_speed_range: [0.1, 0.3]
    angular_speed_range: [0.1, 2.84]
    vary_speed: true
    turt_noise: true
